name: Feature request
description: Suggest an improvement to an existing skill or script
labels: ["enhancement"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or script
      placeholder: "wp-security-review / wp_security_scan.py"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: New rule, flag, recipe or reference section. Include code samples for scanner rules.
