name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach skill zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate before packaging
        run: python tools/validate_skills.py
      - name: Build zips
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -qr "../dist/${name}.zip" "$name" -x '*/__pycache__/*' '*.pyc'
          done
          cd ..
          zip -qr "dist/wordpress-dev-skills-${GITHUB_REF_NAME}.zip" \
            skills .claude-plugin README.md AGENTS.md LICENSE CHANGELOG.md \
            -x '*/__pycache__/*' '*.pyc'
          ls -l dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
