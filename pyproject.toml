[project]
name = "wordpress-dev-skills"
version = "0.1.0"
description = "Agent Skills for WordPress developers (Claude Code, Codex and other Agent Skills clients)."
license = "MIT"
authors = [{ name = "Saizul Amin" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "validate_skills"]

[tool.ruff.lint.per-file-ignores]
# PHP templates inside Python strings use tabs (WordPress coding standards).
"skills/wp-plugin-scaffold/scripts/scaffold_plugin.py" = ["E101", "W191"]
